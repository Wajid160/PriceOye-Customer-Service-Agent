<div class="flex flex-col h-[500px] bg-white rounded-xl">
    <!-- Chat Header -->
    <div class="bg-blue-600 text-white p-4 rounded-t-xl flex justify-between items-center">
        <h3 class="text-xl font-semibold">PriceOye Support</h3>
        <button id="chat-close" class="text-white hover:text-gray-200">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
            </svg>
        </button>
    </div>
    <!-- Chat History -->
    <div id="chat-history" class="flex-1 p-6 overflow-y-auto space-y-4 bg-gray-50">
        {% for message in chat_history %}
            {% if message.user %}
                <div class="flex justify-end">
                    <div class="bg-blue-600 text-white p-3 rounded-l-xl rounded-br-xl max-w-[80%] animate-slide-in-right">
                        {{ message.user }}
                    </div>
                </div>
            {% endif %}
            {% if message.agent %}
                <div class="flex justify-start">
                    <div class="bg-gray-200 text-gray-800 p-3 rounded-r-xl rounded-bl-xl max-w-[80%] animate-slide-in-left">
                        {{ message.agent }}
                    </div>
                </div>
            {% endif %}
        {% endfor %}
    </div>
    <!-- Chat Input -->
    <div class="p-4 border-t bg-white">
        <div class="flex space-x-3">
            <input id="chat-input" type="text" class="flex-1 p-3 text-lg border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-600 placeholder-gray-400" placeholder="Ask about orders, returns, or products...">
            <button id="chat-send" class="bg-blue-600 text-white px-6 py-3 rounded-lg hover:bg-blue-700 transition-colors">Send</button>
        </div>
    </div>
</div>

<style>
    @keyframes slide-in-right {
        from { transform: translateX(20px); opacity: 0; }
        to { transform: translateX(0); opacity: 1; }
    }
    @keyframes slide-in-left {
        from { transform: translateX(-20px); opacity: 0; }
        to { transform: translateX(0); opacity: 1; }
    }
    .animate-slide-in-right { animation: slide-in-right 0.3s ease-out; }
    .animate-slide-in-left { animation: slide-in-left 0.3s ease-out; }
</style>
